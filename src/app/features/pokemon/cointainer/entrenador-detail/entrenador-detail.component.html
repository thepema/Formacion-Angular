@if(entrenador()){
    <div style="border: 3px solid black; padding: 10px; margin: 10px;">
        <h1>Entrenador: {{ entrenador()?.nombre }}</h1>
        <h1>Pokemon: {{ entrenador()?.pokemon.nombre }}</h1>

}
